name: AltarePartners
version: '${version}'
main: com.altare.partners.AltarePartners
api-version: '1.16'
description: Rotating partner announcements for the Altare network. Supports Paper 1.16.5+.
author: Altare
website: https://altare.it

commands:
  altare:
    description: Manage Altare partner announcements
    usage: /altare <reload|list|preview|test>
    permission: altarepartners.admin
    aliases: [altarepartners, partners, ap]
  sponser:
    description: View Altare.gg hosting plans and open the website
    usage: /sponser
    permission: altarepartners.sponsor

permissions:
  altarepartners.admin:
    description: Manage and reload Altare partner announcements
    default: op
  altarepartners.sponsor:
    description: Open the Altare sponsor menu
    default: true
